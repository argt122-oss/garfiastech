[build]
  command = "vite build"
  publish = "dist/client"
  # The official Netlify Vite plugin generates and registers SSR functions;
  # do not override its internal functions directory with netlify/functions.

[build.environment]
  # These are public connection settings, also shipped through VITE_*.
  # Keep scanning enabled for every other variable, especially private keys.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_PUBLISHABLE_KEY"
